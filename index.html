<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>कोठारींचा महाराजा | गणपती बाप्पा मोरया 🙏</title>

  <meta
    name="description"
    content="कोठारींचा महाराजा — गणेशोत्सव २०२६. बाप्पाचे दर्शन, कार्यक्रम, आरती, फोटो आणि संपर्क माहिती."
  />

  <meta name="theme-color" content="#8b241c" />

  <meta property="og:title" content="कोठारींचा महाराजा 🙏" />
  <meta
    property="og:description"
    content="गणपती बाप्पा मोरया • कोठारींचा महाराजा • गणेशोत्सव २०२६"
  />
  <meta property="og:type" content="website" />

  <style>
    /* =====================================================
       KOTHARICHA MAHARAJA
       SINGLE FILE WEBSITE
       ===================================================== */

    :root {
      --red: #8b241c;
      --dark-red: #641b16;
      --orange: #e66f1d;
      --gold: #f3bd3f;
      --light-gold: #fff0c5;
      --cream: #fffaf0;
      --white: #ffffff;
      --brown: #603b2b;
      --muted: #806454;
      --green: #356847;

      --shadow:
        0 15px 50px rgba(91, 42, 20, 0.12);

      --radius: 28px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Noto Sans Devanagari",
        "Nirmala UI",
        "Mangal",
        system-ui,
        sans-serif;

      color: var(--brown);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(243, 189, 63, 0.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 100% 15%,
          rgba(230, 111, 29, 0.12),
          transparent 25%
        ),
        var(--cream);

      line-height: 1.65;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {
      background:
        linear-gradient(
          90deg,
          var(--dark-red),
          var(--red),
          var(--dark-red)
        );

      color: #fff3d7;
      text-align: center;
      padding: 8px 15px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    /* =====================================================
       NAVIGATION
       ===================================================== */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255, 250, 240, 0.94);
      backdrop-filter: blur(16px);

      border-bottom:
        1px solid rgba(139, 36, 28, 0.1);
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;

      min-height: 72px;
      padding: 10px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      color: var(--red);
      font-weight: 950;
      font-size: 1rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand small {
      display: block;
      color: #9c6d4f;
      font-size: 0.68rem;
      margin-top: 3px;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;

      font-size: 0.82rem;
      font-weight: 850;
    }

    .nav-links a {
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--orange);
    }

    .menu-btn {
      display: none;

      border: 0;
      background: transparent;

      color: var(--red);

      font-size: 1.6rem;

      cursor: pointer;
    }

    /* =====================================================
       HERO
       ===================================================== */

    .hero {
      min-height: 760px;

      position: relative;
      overflow: hidden;

      display: grid;
      place-items: center;

      text-align: center;

      padding: 90px 20px 120px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(243, 189, 63, 0.3),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #fff2cf,
          #fffaf0
        );
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 550px;
      height: 550px;

      border:
        1px solid rgba(139, 36, 28, 0.09);

      border-radius: 50%;

      top: -260px;
      left: -190px;
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 650px;
      height: 650px;

      border:
        1px solid rgba(139, 36, 28, 0.08);

      border-radius: 50%;

      right: -310px;
      bottom: -380px;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 900px;
    }

    .om {
      color: var(--red);
      font-size: 3rem;

      animation:
        floating 4s ease-in-out infinite;
    }

    .ganesh-line {
      color: #b26a2a;

      font-weight: 950;
      margin-top: 5px;
    }

    .hero h1 {
      color: var(--red);

      font-size:
        clamp(
          2.8rem,
          8vw,
          6.4rem
        );

      line-height: 1.03;

      font-weight: 950;

      letter-spacing: -2px;

      margin-top: 10px;
    }

    .hero-subtitle {
      color: #754632;

      font-size: 1.25rem;

      font-weight: 900;

      margin-top: 15px;
    }

    .hero-description {
      max-width: 700px;

      margin:
        18px auto 0;

      color: var(--muted);

      font-size: 1.02rem;
    }

    .hero-buttons {
      margin-top: 28px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;
    }

    /* =====================================================
       BUTTONS
       ===================================================== */

    .btn {
      border: 0;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding:
        13px 21px;

      border-radius: 999px;

      font-weight: 900;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--orange),
          var(--red)
        );

      box-shadow:
        0 12px 30px
        rgba(183, 55, 30, 0.25);
    }

    .btn-secondary {
      background: white;

      color: var(--red);

      box-shadow: var(--shadow);
    }

    .btn-green {
      background: var(--green);

      color: white;
    }

    /* =====================================================
       HERO BAPPA PLACEHOLDER
       ===================================================== */

    .bappa-container {
      margin: 45px auto 0;

      width: min(
        340px,
        75vw
      );
    }

    .bappa-circle {
      width: 100%;
      aspect-ratio: 1;

      border-radius: 50%;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          #fffbd9 0 7%,
          transparent 8%
        ),
        radial-gradient(
          circle,
          #f8c94f 0 17%,
          #e9781f 38%,
          #9b281d 68%,
          transparent 69%
        );

      box-shadow:
        0 25px 90px
        rgba(139, 36, 28, 0.2);

      animation:
        floating 5s ease-in-out infinite;
    }

    .bappa-circle::after {
      content: "🙏";

      font-size: 5.5rem;

      filter:
        drop-shadow(
          0 8px 8px
          rgba(0, 0, 0, 0.14)
        );
    }

    .bappa-hint {
      color: #987058;

      font-size: 0.78rem;

      font-weight: 700;

      margin-top: 12px;
    }

    /*
      वास्तविक Bappa फोटो वापरायचा असल्यास:

      <img
        src="images/bappa.jpg"
        class="real-bappa"
        alt="कोठारींचा महाराजा"
      >

      आणि CSS:

      .real-bappa {
        width: min(380px, 85vw);
        margin: 35px auto 0;
        border-radius: 30px;
        box-shadow: var(--shadow);
      }
    */

    /* =====================================================
       COUNTDOWN
       ===================================================== */

    .countdown-section {
      padding: 78px 20px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #fff0c7,
          #ffe3c3
        );
    }

    .kicker {
      color: var(--orange);

      font-size: 0.82rem;

      font-weight: 950;

      letter-spacing: 1px;
    }

    .section-title {
      color: var(--red);

      font-size:
        clamp(
          2rem,
          5vw,
          3.2rem
        );

      line-height: 1.15;

      font-weight: 950;

      margin-top: 7px;
    }

    .section-intro {
      color: var(--muted);

      margin-top: 12px;
    }

    .countdown {
      max-width: 850px;

      margin: 30px auto 0;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .time-box {
      background:
        rgba(255, 255, 255, 0.85);

      border-radius: 22px;

      padding: 22px 10px;

      box-shadow:
        0 12px 35px
        rgba(90, 45, 20, 0.08);
    }

    .time-number {
      color: var(--red);

      font-size:
        clamp(
          2rem,
          6vw,
          3.4rem
        );

      font-weight: 950;

      line-height: 1;
    }

    .time-label {
      color: #93684c;

      font-size: 0.78rem;

      font-weight: 800;

      margin-top: 7px;
    }

    /* =====================================================
       SECTIONS
       ===================================================== */

    .section {
      max-width: 1180px;

      margin: auto;

      padding:
        90px 20px;
    }

    .section-heading {
      max-width: 780px;

      margin:
        0 auto 45px;

      text-align: center;
    }

    /* =====================================================
       QUICK FEATURES
       ===================================================== */

    .quick-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;
    }

    .quick-card {
      background: white;

      border-radius: var(--radius);

      padding: 27px 18px;

      text-align: center;

      box-shadow: var(--shadow);

      border:
        1px solid
        rgba(139, 36, 28, 0.06);

      transition:
        transform 0.2s ease;
    }

    .quick-card:hover {
      transform: translateY(-5px);
    }

    .quick-icon {
      font-size: 2.3rem;
    }

    .quick-card h3 {
      color: var(--red);

      margin-top: 8px;
    }

    .quick-card p {
      color: var(--muted);

      font-size: 0.9rem;

      margin-top: 4px;
    }

    /* =====================================================
       EVENTS
       ===================================================== */

    .events-section {
      background:
        linear-gradient(
          180deg,
          #fffaf0,
          #fff3dc
        );
    }

    .timeline {
      max-width: 820px;

      margin: auto;

      position: relative;
    }

    .timeline::before {
      content: "";

      position: absolute;

      left: 28px;

      top: 0;
      bottom: 0;

      width: 3px;

      border-radius: 99px;

      background:
        linear-gradient(
          var(--gold),
          var(--orange),
          var(--red)
        );
    }

    .event {
      position: relative;

      display: grid;

      grid-template-columns:
        58px 1fr;

      gap: 18px;

      margin-bottom: 20px;
    }

    .event-icon {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: white;

      border:
        3px solid
        var(--orange);

      display: grid;

      place-items: center;

      font-size: 1.3rem;

      z-index: 2;

      box-shadow:
        0 7px 20px
        rgba(100, 45, 10, 0.12);
    }

    .event-card {
      background: white;

      padding: 20px 22px;

      border-radius: 22px;

      box-shadow: var(--shadow);
    }

    .event-date {
      color: var(--orange);

      font-size: 0.78rem;

      font-weight: 950;
    }

    .event-card h3 {
      color: var(--red);

      margin-top: 3px;
    }

    .event-card p {
      color: var(--muted);

      font-size: 0.9rem;

      margin-top: 4px;
    }

    /* =====================================================
       ABOUT
       ===================================================== */

    .about-grid {
      display: grid;

      grid-template-columns:
        1.05fr 0.95fr;

      gap: 30px;
    }

    .about-card,
    .quote-card {
      background: white;

      border-radius: 32px;

      padding: 35px;

      box-shadow: var(--shadow);
    }

    .about-card h3,
    .quote-card h3 {
      color: var(--red);

      font-size: 1.5rem;
    }

    .about-card p {
      color: var(--muted);

      line-height: 1.9;

      margin-top: 14px;
    }

    .quote-card {
      background:
        linear-gradient(
          145deg,
          #fff0cc,
          #fffaf0
        );

      display: flex;

      flex-direction: column;

      justify-content: center;
    }

    .quote {
      color: var(--red);

      font-size: 1.55rem;

      line-height: 1.5;

      font-weight: 900;
    }

    .quote-small {
      color: #85624e;

      margin-top: 15px;
    }

    /* =====================================================
       AARTI
       ===================================================== */

    .aarti-section {
      background:
        linear-gradient(
          180deg,
          #fffdf7,
          #fff0d4
        );
    }

    .aarti-card {
      max-width: 820px;

      margin: auto;

      background: white;

      border-radius: 32px;

      padding: 38px;

      text-align: center;

      box-shadow: var(--shadow);
    }

    .aarti-symbol {
      font-size: 3rem;
    }

    .aarti-card h3 {
      color: var(--red);

      font-size: 1.8rem;

      margin-top: 5px;
    }

    .aarti-text {
      max-width: 650px;

      margin: 20px auto 0;

      color: #6e5041;

      font-size: 1.02rem;

      line-height: 2;
    }

    .aarti-note {
      color: #9a755d;

      font-size: 0.8rem;

      margin-top: 18px;
    }

    /* =====================================================
       GALLERY
       ===================================================== */

    .gallery-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }

    .gallery-card {
      min-height: 260px;

      position: relative;

      overflow: hidden;

      border-radius: 28px;

      box-shadow: var(--shadow);

      background:
        linear-gradient(
          135deg,
          #8b241c,
          #ef8a25
        );

      cursor: pointer;
    }

    .gallery-card:nth-child(2) {
      background:
        linear-gradient(
          135deg,
          #6c251d,
          #f3bd43
        );
    }

    .gallery-card:nth-child(3) {
      background:
        linear-gradient(
          135deg,
          #e46e1d,
          #8c241c
        );
    }

    .gallery-card:nth-child(4) {
      background:
        linear-gradient(
          135deg,
          #f5c548,
          #b93620
        );
    }

    .gallery-card:nth-child(5) {
      background:
        linear-gradient(
          135deg,
          #8b241c,
          #d95e20
        );
    }

    .gallery-card:nth-child(6) {
      background:
        linear-gradient(
          135deg,
          #d95e20,
          #f5c548
        );
    }

    .gallery-placeholder {
      min-height: 260px;

      display: grid;

      place-items: center;

      text-align: center;

      padding: 20px;

      color: white;

      background:
        rgba(0, 0, 0, 0.12);

      font-weight: 900;
    }

    .gallery-placeholder span {
      display: block;

      font-size: 3.5rem;

      margin-bottom: 5px;
    }

    /*
      फोटो लावण्यासाठी उदाहरण:

      <img
        src="images/photo1.jpg"
        alt="बाप्पाचे दर्शन"
      >

      .gallery-card img {
        width:100%;
        height:100%;
        object-fit:cover;
      }
    */

    /* =====================================================
       PRESIDENT
       ===================================================== */

    .president-section {
      background:
        linear-gradient(
          180deg,
          #fff5dc,
          #fffdf8
        );
    }

    .president-card {
      max-width: 760px;

      margin: auto;

      background: white;

      border-radius: 32px;

      padding: 38px;

      text-align: center;

      box-shadow: var(--shadow);
    }

    .avatar {
      width: 95px;
      height: 95px;

      margin: auto;

      border-radius: 50%;

      display: grid;

      place-items: center;

      background:
        linear-gradient(
          135deg,
          #fff0b8,
          #f1a326
        );

      color: var(--red);

      font-size: 2.4rem;

      box-shadow:
        0 10px 30px
        rgba(130, 60, 10, 0.13);
    }

    .president-card h3 {
      color: var(--red);

      font-size: 1.8rem;

      margin-top: 15px;
    }

    .president-card p {
      max-width: 620px;

      margin: 10px auto 0;

      color: var(--muted);

      line-height: 1.9;
    }

    /* =====================================================
       LOCATION
       ===================================================== */

    .location-card {
      max-width: 820px;

      margin: auto;

      background: white;

      border-radius: 32px;

      padding: 35px;

      text-align: center;

      box-shadow: var(--shadow);
    }

    .location-icon {
      font-size: 3rem;
    }

    .location-card h3 {
      color: var(--red);

      font-size: 1.5rem;

      margin-top: 5px;
    }

    .location-card p {
      color: var(--muted);

      margin-top: 4px;
    }

    .map-box {
      min-height: 210px;

      margin-top: 22px;

      border-radius: 24px;

      display: grid;

      place-items: center;

      text-align: center;

      padding: 20px;

      color: var(--red);

      font-weight: 900;

      background:
        linear-gradient(
          rgba(139, 36, 28, 0.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(139, 36, 28, 0.06) 1px,
          transparent 1px
        ),
        #fff8e8;

      background-size: 28px 28px;
    }

    /* =====================================================
       SHARE
       ===================================================== */

    .share-section {
      padding-top: 20px;
    }

    .share-box {
      max-width: 900px;

      margin: auto;

      padding: 45px 25px;

      border-radius: 35px;

      text-align: center;

      color: white;

      background:
        linear-gradient(
          135deg,
          #8b241c,
          #bd3b20
        );

      box-shadow:
        0 25px 70px
        rgba(139, 36, 28, 0.2);
    }

    .share-box h2 {
      font-size:
        clamp(
          1.8rem,
          5vw,
          2.8rem
        );
    }

    .share-box p {
      color: #ffe8c5;

      margin-top: 8px;
    }

    .share-buttons {
      margin-top: 22px;

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .share-buttons .btn {
      background: white;

      color: var(--red);
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      margin-top: 70px;

      padding:
        55px 20px;

      text-align: center;

      background: #64231b;

      color: #ffe8c6;
    }

    footer .big {
      font-size: 1.8rem;

      font-weight: 950;
    }

    footer p {
      max-width: 650px;

      margin: 12px auto;

      color: #f4d4a6;
    }

    footer small {
      color: #d8b68d;
